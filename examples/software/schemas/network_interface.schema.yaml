orm:
  singular: Network Interface
  plural: Network Interfaces
  relations:
    - local_property: server
      joins:
        - schema: server.schema.yaml
          local_key: server_name
          foreign_key: name
          type: many
    - local_property: network
      joins:
        - schema: network.schema.yaml
          local_key: network_name
          foreign_key: name
          type: one
    - local_property: domain_targets
      joins:
        - type: many
          schema: domain_target.schema.yaml
          local_key: interface
          foreign_key: target
properties:
  name:
    type: string
    expression: this.server_name + ' ' + this.network_name + ' ' + this.interface
  network_name:
    type: string
  server_name:
    type: string
  interface:
    oneOf:
    - type: string
      pattern: ^[1-9][0-9]?[0-9]?\.[0-9][0-9]?[0-9]?\.[0-9][0-9]?[0-9]?\.[1-9][0-9]?[0-9]?$
    - type: string
      pattern: ^[a-zA-Z0-9][a-zA-Z0-9-]{1,61}[a-zA-Z0-9]\.[a-zA-Z]{2,}$

required: [ network_name, server_name, interface ]
additionalProperties: false