orm:
  singular: Component Dependency
  plural: Component Dependencies
  relations:
    - local_property: parent_component
      joins:
        - type: one
          schema: component.schema.yaml
          local_key: parent_component_name
          foreign_key: name
    - local_property: child_component
      joins:
        - type: one
          schema: component.schema.yaml
          local_key: child_component_name
          foreign_key: name
    - local_property: service
      joins:
        - schema: service.schema.yaml
          local_key: service_name
          foreign_key: name
          type: one
type: object
properties:
  name:
    type: string
    expression: this.parent_component_name + " " + this.child_component_name
  parent_component_name:
    type: string
  child_component_name:
    type: string
  service_name:
    type: string
  config_sets:
    type: object
    properties:
      defaults:
        type: object
        additionalProperties:
          oneOf:
            - type: string
            - type: boolean
            - type: array
              items:
                type: string
    additionalProperties:
      type: object
      additionalProperties:
        oneOf:
          - type: string
          - type: boolean
          - type: array
            items:
              type: string
required: [ parent_component_name, child_component_name ]
additionalProperties: false